name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Enx.Atomic.Avalonia.slnx

      - name: Build
        run: dotnet build Enx.Atomic.Avalonia.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/Enx.Atomic.Avalonia.Tests/Enx.Atomic.Avalonia.Tests.csproj --no-build --configuration Release
