name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      # Let each OS report on its own: a Windows-only failure shouldn't hide the Linux result (or vice versa).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A green run takes ~1-2 min; anything near this limit is a hang, not a slow test.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Enx.Atomic.Avalonia.slnx

      # OS-independent, and Windows' checkout converts line endings: checked once, on Linux.
      - name: Check formatting (CSharpier)
        if: runner.os == 'Linux'
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        run: dotnet build Enx.Atomic.Avalonia.slnx --no-restore --configuration Release

      # --blame-hang-timeout kills a stuck test host and reports which test was running (plus a dump),
      # instead of the job silently hanging until it's cancelled; the console logger lists each test as it
      # completes so the log shows how far the run got.
      - name: Test with coverage
        timeout-minutes: 12
        run: >
          dotnet test Tests/Enx.Atomic.Avalonia.Tests/Enx.Atomic.Avalonia.Tests.csproj
          --no-build --configuration Release
          --logger "console;verbosity=normal"
          --blame-hang-timeout 8m
          --blame-hang-dump-type mini
          --results-directory TestResults
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=../../coverage/

      - name: Upload test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore

      # Coverage is uploaded from one OS only, so Codecov compares like with like across commits.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.cobertura.xml
          fail_ci_if_error: true
