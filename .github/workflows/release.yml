name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for NuGet Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs full history/tags to compute the version from the pushed tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Enx.Atomic.Avalonia.slnx

      - name: Build
        run: dotnet build Enx.Atomic.Avalonia.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Tests/Enx.Atomic.Avalonia.Tests/Enx.Atomic.Avalonia.Tests.csproj
          --no-build --configuration Release

      - name: Pack
        run: |
          dotnet pack Sources/Enx.Atomic.Avalonia/Enx.Atomic.Avalonia.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack Sources/Enx.Atomic.Avalonia.Preset.Mini/Enx.Atomic.Avalonia.Preset.Mini.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack Sources/Enx.Atomic.Avalonia.CodeGen/Enx.Atomic.Avalonia.CodeGen.csproj --no-build --configuration Release --output ./nupkgs

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
